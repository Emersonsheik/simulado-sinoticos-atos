<div id="root"></div>

<script>
// Material de estudo. Cada seção tem uma chave (k) usada pelas questões em "fonte" (ex.: '4:q' = aula de id 4, seção q).
const MATERIA = [
{id:1, tag:'Aula', n:'1', titulo:'O mundo mediterrâneo do NT (1/2)', secoes:[
 {k:'dominio', t:'Israel sob domínio estrangeiro', p:[
  'Entre 587 e 538 a.C. os judeus foram libertados da Babilônia e voltaram à Palestina. Depois disso, Israel foi governado por várias nações pagãs: Pérsia, Grécia, Império Macedônio, Roma Republicana (63–27 a.C.), Império Romano (27 a.C.–324 d.C.), Império Bizantino (324–638 d.C.) etc.',
  'Essas nações geralmente não interferiam muito na religião de Israel. Por isso os judeus tinham um grau considerável de autonomia religiosa e um grau menor de autonomia política. Assim, grande parte da tradição do judaísmo (sacerdotes, dias religiosos, Torá, sinagogas) foi preservada e estava ativa nos dias de Jesus.']},
 {k:'reinos', t:'Os quatro reinos helenísticos', p:[
  'Após a morte de Alexandre, o Grande, rei da Macedônia, em 323 a.C., houve cerca de 40 anos de guerras entre seus generais e sucessores. O império foi reorganizado em quatro reinos helenísticos principais:',
  '<strong>Reino Ptolemaico</strong> — fundador Ptolomeu I Sóter; capital Alexandria, no Egito. <strong>Império Selêucida</strong> — fundador Seleuco I Nicátor; Síria, Mesopotâmia, Pérsia e regiões orientais; a Judeia ficou sob seu domínio por um período; Antíoco IV Epífanes foi um de seus reis. <strong>Reino da Macedônia</strong> — dominava a Grécia e a Macedônia. <strong>Reino da Trácia</strong> — governado por Lisímaco (Trácia e oeste da atual Turquia); depois foi quase todo incorporado ao Império Selêucida.']},
 {k:'macabeus', t:'Antíoco IV e a Revolta dos Macabeus', p:[
  'A Judeia esteve primeiro sob a dinastia ptolemaica e, por volta de 200 a.C., passou ao controle selêucida. A perseguição de Antíoco IV Epífanes foi a causa direta da Revolta dos Macabeus: ele ergueu um altar a deuses pagãos no Templo de Jerusalém e sacrificou um porco (animal impuro para os judeus). Os judeus resistiram, crendo que o templo fora contaminado e Deus blasfemado. Antíoco reagiu queimando a Torá e matando os pais que circuncidavam seus filhos.',
  'Em Modein (Modiin), a noroeste de Jerusalém, os judeus foram forçados a adorar um deus pagão no mercado. O sacerdote Matatias e seus filhos (Joanã, Judas, Eleázer, Jônatas e Simão) se recusaram e lideraram a rebelião — a Revolta dos Macabeus.',
  'As tropas selêucidas fracassaram em reprimi-la. Cerca de 20 anos depois, Simão Macabeu fundou a <strong>dinastia hasmoneana</strong> (142 a.C.), que durou 79 anos, até a conquista romana em 63 a.C.']},
 {k:'helenizacao', t:'Alexandre e a helenização', p:[
  'Alexandre quis transformar seu território numa unidade cultural e linguística: estabeleceu uma cultura sincrética (síntese do grego clássico com a cultura antiga do Oriente) e o <strong>grego koiné</strong> como língua franca (falado no Mediterrâneo oriental do séc. IV a.C. ao séc. VI d.C.). Essa grande mudança é chamada de "helenização".',
  'A estratégia escolhida foi a construção de cidades helenísticas (<strong>polis</strong>), ligadas por estradas bem pavimentadas, o que facilitou a troca de mercadorias e ideias (cf. Atos 17:21).']},
 {k:'helenismo_israel', t:'Helenismo em Israel', p:[
  'Por volta de 320–143 a.C., as cidades da costa, da região transjordaniana e do sul do Mar da Galileia foram helenizadas sem muito conflito. Jerusalém foi diferente: seus moradores assumiram uma de duas posições — apoio entusiástico ou oposição ferrenha.',
  'Alguns líderes apoiavam a helenização porque ela trazia bem-estar e prosperidade. O problema deles era a Torá (ex.: na escola helenizada os alunos se exercitavam sem roupas). Eles queriam reinterpretar a Torá para se adaptarem ao "novo mundo". Se tivessem conseguido, o judaísmo teria desaparecido; os combatentes macabeus impediram isso.',
  'A cultura judaica não foi absorvida, mas absorveu elementos helenísticos sem perder sua identidade. Ex.: os estoicos criam em leis invisíveis dadas pelo Logos; os judeus disseram que as leis da Torá são as leis do mundo. O primeiro a aplicar essa ideia foi Ben Sira (Sirach, c. 190 a.C.; Sir 24:23). O templo de Jerusalém ilustra isso: exterior muito parecido com templos helenísticos, interior quase intacto.']},
 {k:'judaismo', t:'Helenismo × judaísmo', p:[
  '"Helenismo" era o modo de vida exigido por Alexandre: vestir, falar e viver como os gregos. Contra essa onda, alguns judeus procuraram viver de maneira judaica — isso é chamado de "judaísmo". O primeiro a usar a palavra "judaísmo" foi o autor de <strong>2 Macabeus</strong> (2 Mac 8:1).',
  'Ser helenista ou judaizante não era questão de sangue: um judeu étnico podia abandonar o judaísmo e se helenizar, e um gentio podia se tornar judaizante (cf. 2 Mac 4:13).']},
 {k:'faccoes', t:'As facções do judaísmo: elite sacerdotal e saduceus', p:[
  'Nos dias de Jesus o judaísmo não era homogêneo: várias facções competiam pela posição de "mestres de Israel". Foi nessa arena que Jesus surgiu e atuou.',
  '<strong>1. Elite sacerdotal</strong> — grupo estabelecido pelo AT para ensinar e dirigir o povo; a mais ampla influência e a mais numerosa; provavelmente os "sacerdotes e escribas" do NT.',
  '<strong>2. Saduceus</strong> — subgrupo dentro do grupo sacerdotal, da aristocracia. Segundo Josefo, criam que "a alma perece junto com o corpo" e que "Deus não interfere nos eventos humanos" (semelhantes aos epicuristas). Não criam na escatologia apocalíptica e provavelmente rejeitavam os regulamentos extrabíblicos dos fariseus.']},
 {k:'qumran', t:'A comunidade de Qumran', p:[
  'Comunidade de judeus contrários à dinastia hasmoneana. Eram separatistas que deixaram Jerusalém dizendo: "Vamos criar um Israel de verdade por conta própria". Parece ser um ramo dos essênios (Dio Crisóstomo e Plínio situam os essênios às margens do Mar Morto, entre Jericó e En Gedi).',
  'Havia uma raiz comum com os saduceus: dois grupos se opunham aos hasmoneus — um saiu e viveu separado (os qumranitas), outro ficou no centro e lutou (os saduceus), mas com o tempo se conformou com o status quo.',
  'A seita existiu de 140 a.C. a 68 d.C. (conquistada pelos romanos). Sua teologia era fundamentalista: "somos os únicos israelitas verdadeiros, os filhos da luz, e venceremos os filhos das trevas". Hierarquia: sacerdotes, levitas e pessoas comuns.',
  'Para eles, com a ascensão de sacerdotes <strong>não zadoquitas</strong> sob os hasmoneus, o Templo foi corrompido; Deus o abandonou e passou a habitar na comunidade — "nós somos o verdadeiro Israel".',
  'Esperavam <strong>dois Messias</strong>: um sacerdote ungido e um rei ungido; o sumo sacerdote escatológico zadoquita era mais alto que o Messias davídico. O sacerdote restauraria o culto no templo; o rei julgaria as nações gentias e restauraria a dinastia davídica.']},
 {k:'fariseus', t:'Os fariseus', p:[
  'Segundo Josefo, eram políticos astutos que surgiram em meados do séc. II a.C. Naquela época, religião e política não se separavam: as facções (exceto Qumran) competiam pelo poder dentro do Império Romano.',
  'Impunham regras não mencionadas no AT para "erguer um muro de proteção" em torno da lei (alimentação, dízimo etc.). Segundo Jacob Neusner, o objetivo era fazer de cada israelita "um sacerdote", cumprindo Êxodo 19:6.',
  'Para isso criaram as <strong>havurot</strong>: grupos para manter a pureza e comer em mesa totalmente kosher, apenas entre os membros. Daí parece vir o nome "fariseu": aquele que se separa.']},
 {k:'zelotes', t:'Os zelotes', p:[
  'Melhor caracterizados como <strong>judaísmo militar nacionalista</strong>. Por crerem que só Deus é Senhor, não toleravam o domínio romano e estavam dispostos ao confronto físico.',
  'Segundo Josefo, surgiram em resposta ao censo de <strong>Quirino</strong> (Lc 2:2), pois contar o povo era contra o AT e o censo servia para cobrar impostos. Foram formados por Judas de Gamla e Zadoque, um fariseu. Os filhos de Judas foram executados em 47 d.C.; seu descendente Menahem liderou a revolta de 66. Alguns líderes zelotes se diziam Messias.',
  'A grande revolta de 66–70 foi desencadeada pelos zelotes. No início foi uma guerra civil entre judeus; depois os líderes entregaram o comando da guerra aos zelotes.']},
 {k:'nova_ordem', t:'A nova ordem após 70 d.C.', p:[
  'A destruição do Templo em 70 d.C. trouxe uma nova ordem: sacerdotes e saduceus desapareceram (a base de seu poder acabou); os zelotes foram mortos pelas tropas romanas. Segundo Eusébio, restaram apenas dois grupos: o <strong>judaísmo rabínico</strong> e a <strong>comunidade cristã</strong>.']},
 {k:'palest_helen', t:'Judaísmo palestino × judaísmo helenístico', p:[
  '<strong>Palestino</strong>: Judeia, Galileia e Samaria; hebraico e aramaico; texto hebraico da Bíblia (Tanakh); forte preservação das tradições; centro no Templo; líderes: sacerdotes, escribas, fariseus; pouca influência da filosofia grega; observância rigorosa da Lei. Representantes: Jesus, os Doze, fariseus e escribas.',
  '<strong>Helenístico</strong>: Alexandria, Antioquia, Éfeso, Corinto e outras regiões da diáspora; grego koiné; a Septuaginta (LXX); maior influência grega; sinagogas da diáspora; alguma integração com a filosofia helenística; tentativa de manter a fé numa sociedade greco-romana. Representantes: Fílon de Alexandria e Apolo (Atos 18).',
  '<strong>Semelhanças</strong>: criam no único Deus de Israel; reconheciam a Lei de Moisés; valorizavam circuncisão, sábado e festas; esperavam o Messias. <strong>Principal diferença</strong>: língua, cultura e ambiente social.']},
 {k:'atos6', t:'Hebreus e helenistas (Atos 6:1)', p:[
  'Os <strong>hebreus</strong> eram cristãos judeus criados na Palestina, que falavam aramaico. Os <strong>helenistas</strong> eram cristãos judeus criados na diáspora, que falavam grego. A distinção não era entre judeus e gentios: ambos eram judeus que creram em Jesus.',
  'O problema: as viúvas dos helenistas eram esquecidas na distribuição diária. Os apóstolos propuseram escolher sete homens (At 6:2–6), todos com nomes gregos, como Estêvão e Filipe — provavelmente para atender à comunidade helenista.']}
]},
{id:2, tag:'Aula', n:'2', titulo:'O mundo mediterrâneo do NT (2/2)', secoes:[
 {k:'koine', t:'O grego koiné', p:[
  'Alexandre quis unificar o idioma do império pelo grego koiné ("comum"). Os falantes do grego clássico o criticavam como "deselegante e bárbaro", mas ele se tornou o idioma dos impérios e um meio eficaz de comunicação. Nele o NT foi escrito, e a LXX se tornou a Bíblia da igreja primitiva.']},
 {k:'linguas', t:'As quatro línguas da Palestina', p:[
  '<strong>Latim</strong> — a mais recente e a menos usada; quase exclusiva dos oficiais romanos.',
  '<strong>Grego</strong> — espalhou-se com a helenização, mas provavelmente não era de uso popular (Meyer, com base em Josefo). Martin Hengel: de 80.000–100.000 pessoas em Jerusalém, talvez 8.000–16.000 falassem grego. Jesus não teria sido formalmente educado em grego.',
  '<strong>Hebraico</strong> — a língua sagrada; entrou em declínio porque o aramaico virou língua franca (períodos neo-assírio e persa) e porque os que voltaram da Babilônia falavam aramaico (Ne 13:24). Jesus pode ter usado um pouco com escribas e fariseus. Textos de Qumran em hebraico mostram que continuou sendo usado por alguns grupos.',
  '<strong>Aramaico</strong> — língua oficial dos impérios neo-assírio e babilônico; virou língua cotidiana dos judeus exilados; surgiram os Targuns (traduções aramaicas da Bíblia); língua franca com o Império Persa (séc. VI a.C.). Era a língua do dia a dia do judeu médio no séc. I. Jeremias: Jesus falava um dialeto galileu do aramaico ocidental.']},
 {k:'politica', t:'Dimensão política', p:[
  'Em 63 a.C., após o colapso hasmoneu, os líderes judeus pediram ao general romano Pompeu: 1) abolir a constituição hasmoneia; 2) restaurar a antiga teocracia sacerdotal sob os auspícios romanos.',
  'Motivos: 1) o sumo sacerdote/rei macabeu (Jônatas) não descendia de Zadoque (Ez 40:46; 43:19) nem de Davi; 2) sabiam que Roma reconhecia o judaísmo e não interferia muito.',
  'Mesmo assim houve conflitos: no governo de Herodes, o Grande (37–4 a.C.), e no governo direto do império — 66–70 (Jerusalém destruída), 115–117 e 132–135.']},
 {k:'sinedrio', t:'O Sinédrio', p:[
  'O mais alto órgão judicial religioso judaico. Roma concedeu aos judeus certa autonomia em questões religiosas e étnicas, exercida pelo Sinédrio. Tinha <strong>70 membros</strong> eleitos entre fariseus e saduceus e era presidido pelo <strong>sumo sacerdote</strong>. O NT o chama de "conselho", "chefes dos sacerdotes, anciãos e escribas" etc.']},
 {k:'tensao', t:'A tensão entre judeus e romanos', p:[
  'Roma tinha tolerância religiosa, mas com limites. Tradições judaicas que chocavam: 1) <strong>a circuncisão</strong> — contrária às ideias romanas de beleza física, mas foi tolerada aos poucos; 2) <strong>o desrespeito aos deuses romanos</strong> — por serem monoteístas, os judeus eram tachados de "ateus" e "odiadores dos homens", e houve pogroms já antes do cristianismo; 3) <strong>não se curvar à estátua do imperador</strong> — os judeus eram vistos como politicamente não confiáveis.']},
 {k:'cristaos', t:'Os cristãos da primeira geração', p:[
  'Os cristãos judeus tinham os mesmos direitos e liberdade religiosa dos judeus tradicionais. Os cristãos gentios, porém, continuavam romanos aos olhos das autoridades e deviam viver o politeísmo (adorar o imperador e os deuses). Sofriam o preconceito contra os judeus sem ter a proteção dada aos judeus.',
  'A resposta típica das autoridades: 1) ignorá-los, por serem poucos; 2) esperar que desaparecessem; 3) quando descobriam ofensas (não se curvar à estátua do imperador etc.), vinham acusações, denúncias e perseguições.']},
 {k:'diaspora', t:'Os judeus da diáspora', p:[
  'Havia muito mais judeus fora da Palestina do que dentro. Dois tipos: <strong>hebraístas</strong>, que mantinham fé, língua e costumes judaicos (e por isso eram mal compreendidos), e <strong>helenistas</strong>, que mantinham a fé mas adotavam, em graus variados, a língua e os costumes gregos (ex.: Fílon de Alexandria).',
  'Roma não lhes deu cidadania, mas deu poder judiciário (julgar conflitos pela lei) e tolerância religiosa. Eles difundiam o judaísmo e ganhavam dois tipos de convertidos: prosélitos (circuncidados, guardavam toda a lei) e <strong>tementes a Deus</strong> (gentios que criam no Deus único e na lei mosaica e frequentavam a sinagoga sem se circuncidar).']},
 {k:'galileia', t:'A situação econômica da Galileia', p:[
  'Jesus era carpinteiro (Mc 6:3) — não no sentido moderno, mas alguém que fazia móveis simples de madeira: portas, camas, mesas, bancos, candelabros.',
  'Estratificação: <strong>ricos</strong> (Herodes Antipas, oficiais da corte — Mc 6:21, grandes proprietários, comerciantes, supervisores de impostos; cf. Zaqueu); <strong>classe média</strong> (empresários, artesãos, fazendeiros com terra razoável); <strong>classe baixa</strong> (pequenos agricultores em existência precária; na base, diaristas, empregados e agricultores despossuídos).',
  'O ministério de Jesus concentrou-se em vilas judaicas tradicionais (Nazaré, Cafarnaum, Caná, Naim, Corazim). Ele visitou regiões helenizadas — Decápole (Mc 7:31), Gerasa (Mc 5), Tiro e Sidom (Mc 7:24–30) — mas não há registro de ministério regular e prolongado nelas.']}
]},
{id:3, tag:'Aula', n:'3', titulo:'Das tradições aos Evangelhos', secoes:[
 {k:'processo', t:'Das tradições ao Evangelho de Marcos', p:[
  'O processo: movimento do Reino de Deus iniciado por Jesus → ascensão → surgimento das tradições sobre Jesus → transmissão oral (período das tradições orais) → morte dos apóstolos e necessidade de ensinar os novos convertidos → tradições escritas → surgimento do Evangelho de Marcos, sob a inspiração do Espírito Santo.',
  'Após a ascensão, os seguidores transmitiam oralmente histórias curtas sobre Jesus (milagres, ensinos, exorcismos etc.). Cada uma é chamada de "tradição de Jesus", e o período em que eram transmitidas oralmente é o "período das tradições orais".']},
 {k:'curtas', t:'Por que as tradições eram curtas', p:[
  'Baseavam-se na memória e se concentravam nos pontos principais; os detalhes periféricos eram excluídos na transmissão. Exceção: a <strong>tradição da paixão</strong> era longa, porque a negação de Pedro, o julgamento, a crucificação e a morte eram de grande interesse e se encadeavam naturalmente.',
  'A tradição escrita podia ter várias formas: pequenas unidades (ditos, parábolas, milagres, controvérsias), narrativas maiores (paixão), coleções, Q, o "evangelho do Nazareno" (documento hipotético) e, por fim, os próprios Evangelhos.']},
 {k:'marcos_data', t:'Por que Marcos foi escrito tão tarde?', p:[
  'Marcos provavelmente foi escrito em meados dos anos 60, cerca de 30 anos após a ascensão. Explicações: 1) a expectativa entusiástica da parusia iminente; 2) a percepção judaica de que a tradição oral era mais sagrada que a escrita.']},
 {k:'sitz', t:'Perícopes e Sitz im Leben', p:[
  'As tradições eram usadas em várias ocasiões da igreja primitiva (<strong>Sitz im Leben</strong>): sermões, evangelismo, catecismo, apologética, resolução de conflitos.',
  'Cada tradição é uma unidade literária autônoma — uma narrativa completa, "uma peça de um só ato", não um episódio de série. Circulavam de forma independente. Os críticos da forma as chamam de <strong>perícopes</strong>.',
  'Os críticos da forma identificam as perícopes, classificam seus gêneros, reconstroem suas formas originais e investigam o Sitz im Leben de cada categoria. Ex.: histórias de pronunciamento → sermões; histórias de milagres → apologética (evidenciar a divindade de Jesus); ditos legais → disputas na igreja.']},
 {k:'observacoes', t:'Observações sobre as tradições', p:[
  'Havia tradições orais antes de Marcos. Elas circulavam como unidades independentes e foram transmitidas separadas do contexto original: não sabemos com precisão em que situação Jesus usou cada uma, a quem e com que propósito. Mas, como o tema central de Jesus era o reino de Deus, muitas delas transmitiam seu ensino sobre o reino.']},
 {k:'pronunciamento', t:'1. Histórias de pronunciamento', p:[
  'Narrativas em que o clímax está nas palavras de Jesus — uma declaração marcante, muitas vezes numa controvérsia. Estrutura: breve situação → conflito ou pergunta → declaração decisiva de Jesus → conclusão. Não pretendem dar informação biográfica, mas transmitir uma palavra de Jesus.',
  'Exemplos: a colheita de espigas no sábado (Mc 2:23–28) — "O sábado foi feito por causa do homem, e não o homem por causa do sábado"; o imposto a César (Mc 12:13–17; Mt 22:15–22; Lc 20:20–26) — "Dai a César o que é de César e a Deus o que é de Deus". Exercícios: Mc 3:31–35 (v. 35); Mc 10:13–16 (vv. 14–15).',
  'Paralelo helenístico: a <strong>chreia</strong> — um dito ou ato conciso atribuído a alguém e útil para a vida (ex.: Diógenes, perguntado como ficar famoso: "Preocupando-se o mínimo possível com a fama").']},
 {k:'milagres', t:'2. Tradições de milagres', p:[
  'Relatam os atos poderosos de Jesus. Estrutura comum: 1) situação de necessidade (doença, possessão, morte, fome, tempestade); 2) pedido ou busca de ajuda; 3) palavra ou ação poderosa de Jesus; 4) realização do milagre; 5) reação das pessoas. Os milagres de natureza não têm estrutura padronizada (Meier).',
  '<strong>Cura</strong>: paralítico (Mc 2:1–12), mulher com hemorragia (Mc 5:25–34), Bartimeu (Mc 10:46–52), servo do centurião (Mt 8:5–13). <strong>Exorcismo</strong>: sinagoga (Mc 1:21–28), geraseno (Mc 5:1–20), menino possesso (Mc 9:14–29). <strong>Natureza</strong> (levam à pergunta "Quem é esse Jesus?"): tempestade (Mc 4:35–41), multiplicação dos pães (Mc 6:30–44), andar sobre as águas (Mc 6:45–52), pesca maravilhosa (Lc 5:1–11), figueira (Mt 21:18–20). <strong>Ressurreição</strong>: filha de Jairo (Mc 5:21–43), filho da viúva de Naim (Lc 7:11–17), Lázaro (Jo 11).',
  'Ponto central: não é só mostrar coisas extraordinárias, mas revelar a <strong>autoridade e a identidade</strong> de Jesus — sobre doenças, demônios e Satanás, a natureza e até a morte.']},
 {k:'parabolas', t:'3. Parábolas × alegoria', p:[
  'Parábolas são histórias curtas para ensinar verdades divinas; podem ser verdadeiras, fictícias ou uma mistura. Não são alegorias.',
  'Ex.: o bom samaritano (Lc 10:25–37). Como parábola, a mensagem central é: o verdadeiro amor ao próximo ultrapassa barreiras e se manifesta em misericórdia. Como alegoria, cada detalhe ganharia um símbolo: ladrões = Satanás, Jerusalém = céu, Jericó = mundo caído, samaritano = Jesus, hospedaria = igreja. Isso foi praticado na história da Igreja, mas não devemos atribuir símbolos quando o texto não os indica.',
  'Em resumo: a parábola transmite uma verdade central; na alegoria vários elementos têm correspondências simbólicas. Exemplos de parábolas: Mc 4:30–32 (grão de mostarda), Mt 25:1–13, Lc 12:16–21.']},
 {k:'alegoria_judaica', t:'Os judeus conheciam a alegoria?', p:[
  'Sim: no cântico da vinha (Is 5), a vinha = Israel e o dono = Deus; e Jesus, ao explicar o semeador (Mt 13), faz correspondências (semente = palavra; solo = corações). A alegoria não era estranha à cultura judaica.',
  'No início do séc. XX, Adolf <strong>Jülicher</strong> defendeu que a parábola tem apenas uma mensagem central; pesquisas posteriores acharam isso simplificador. Hoje: 1) a parábola comunica uma afirmação central ou alguns focos; 2) em alguns casos certos elementos têm sentido simbólico; 3) nem todos os detalhes são códigos.']},
 {k:'leitura_publico', t:'Como o público de Jesus lia as parábolas', p:[
  'Os ouvintes buscavam o desafio central e a mensagem sobre o Reino, não alegorizar cada detalhe. Razões: 1) o AT já usa a parábola como gênero — Natã conta a Davi a história da cordeirinha (2Sm 12): "Tu és esse homem!"; 2) no judaísmo já existia o <strong>mashal</strong> (parábola, provérbio, ilustração, fábula: comunicar uma verdade profunda por algo familiar) — Jesus não criou um novo gênero, usou um existente; 3) Jesus explica muito menos parábolas do que se esperaria ("Quem tem ouvidos para ouvir, ouça"); 4) os discípulos pediam o significado da parábola como um todo.',
  'O gênero determina a leitura: a parábola leva a perguntar "O que esta história pretende comunicar?"; a literatura apocalíptica, "A que se refere este símbolo ou visão?"; a narrativa histórica, "O que aconteceu?". O público de Jesus era uma comunidade interpretativa que lia cada gênero de modo apropriado.']},
 {k:'sermao_critica', t:'Crítica de um sermão (Mc 4:35–41)', p:[
  'Um pregador interpretou a tempestade acalmada como alegoria: "Como o cristão pode vencer vivendo em meio às ondas da vida". Crítica: a mensagem central dessa tradição é a autoridade e a identidade de Jesus — a pergunta culminante é "Quem é este que até o vento e o mar lhe obedecem?". Confiar em Jesus nas crises é verdade, mas não é o foco do texto.']},
 {k:'discurso', t:'4. Discurso', p:[
  'Os críticos da forma creem que declarações de Jesus proferidas separadamente foram depois ligadas em discursos. Ex.: João 15–17; Mateus parece ter reunido tematicamente ensinos de Jesus, como em 5:3–7:27 (o reino inaugurado e a ética do povo do reino).']},
 {k:'lenda', t:'5. Lenda', p:[
  'Na crítica da forma, "lenda" <strong>não significa "história falsa"</strong>: são narrativas transmitidas pela comunidade de fé e desenvolvidas para enfatizar o significado religioso de pessoas ou acontecimentos (grandeza, autoridade, santidade, identidade).',
  'Exemplos: o batismo de Jesus (Mc 1:9–11 — céus abertos, pomba, voz), a tentação (Mt 4:1–11; Lc 4:1–13), a transfiguração (Mc 9:2–8), as narrativas do nascimento (Mt 1–2; Lc 1–2).',
  'Termos como "lenda" e "mito" foram escolhidos por estudiosos liberais; os evangélicos devem entender as definições e não se confundir com os nomes.']},
 {k:'mito', t:'6. Mito', p:[
  'Tradições que envolvem a intervenção direta de Deus na história humana. Ex.: a voz de Deus na transfiguração e no batismo.']},
 {k:'criticas', t:'Críticas à crítica da forma', p:[
  '1) As tradições nem sempre pertencem a um gênero preciso: Mc 2:1–12 é milagre ou pronunciamento? O mesmo vale para Mc 3:1–6.',
  '2) Os primeiros críticos da forma achavam que os evangelistas só faziam "tesoura e cola". Na verdade eram <strong>autores criativos</strong>, que selecionaram e organizaram tradições numa obra com começo, desenvolvimento e fim (analogia das pérolas e do colar de pérolas).',
  '3) Apesar das críticas iniciais dos conservadores, hoje a crítica da forma é uma das ferramentas mais importantes para analisar os Evangelhos.',
  '4) São necessárias duas abordagens: analisar as tradições individuais (crítica da forma) e analisar cada Evangelho como obra inteira (crítica narrativa ou narratologia).']}
]},
{id:4, tag:'Aula', n:'4', titulo:'O problema dos sinóticos', secoes:[
 {k:'definicao', t:'O que é o problema sinótico', p:[
  'Os sinóticos são os três primeiros Evangelhos (Mateus, Marcos e Lucas), que podem ser vistos juntos por serem semelhantes em descrição, vocabulário e ordem dos eventos. João não faz parte, pois é muito diferente.',
  'Fenômenos observados: 1) algumas histórias aparecem nos três; 2) algumas passagens são comuns só a Mateus e Lucas; 3) às vezes as palavras são quase idênticas; 4) ao mesmo tempo, há diferenças de ordem, conteúdo e expressão.',
  'Em resumo, o problema sinótico é o problema de <strong>determinar a relação literária entre os sinóticos</strong>: quem usou quem? Havia fontes comuns? Qual foi escrito primeiro?']},
 {k:'termos', t:'Teoria, hipótese, conjectura...', p:[
  'Teoria: explicação sistemática baseada em muitas evidências. Hipótese: explicação proposta com base em algumas evidências, que ainda precisa ser testada. Conjectura: conclusão com informações incompletas. Suposição: algo aceito sem evidências suficientes. Especulação: ideia sem evidências sólidas.',
  'Ordem pela força das evidências: <strong>teoria → hipótese → conjectura → suposição → especulação</strong> (a ordem entre as três últimas não é absoluta).',
  'Fala-se em "hipótese" das duas fontes porque a existência da fonte Q ainda não foi comprovada: nenhum documento dela foi encontrado.']},
 {k:'paralelos', t:'Semelhanças: versículos paralelos e ordem', p:[
  'Versículo paralelo é um versículo semelhante ou idêntico em outro Evangelho (ex.: Mc 10:13 ↔ Lc 18:15). Vocabulário, descrições e construção das frases são frequentemente semelhantes ou idênticos. Ferramenta útil: <em>Synopsis of the Four Gospels</em>.',
  'A ordem dos eventos menores da vida de Jesus também é semelhante. Mateus, sobretudo do cap. 12 em diante, segue de perto a ordem de Marcos.']},
 {k:'malaquias', t:'A citação de Malaquias 3:1', p:[
  'Os sinóticos citam Ml 3:1a (Mt 11:10; Mc 1:2; Lc 7:27). Há 4 diferenças entre a LXX e os sinóticos, e onde diferem da LXX eles concordam entre si. Todos usam "preparará" (kataskeuasei) em vez de "olhará" (epiblepsetai) da LXX. É improvável que cada um tenha traduzido o Texto Massorético sozinho e chegado às mesmas palavras.',
  'Inferência: os autores não dependeram de fontes externas (LXX, Targum, AT), mas uns dos outros (dependência interna). A próxima pergunta é a da <strong>prioridade</strong>: qual foi escrito primeiro?',
  'Marcos 1:2 é uma <strong>citação composta</strong>: une Êxodo 23:20, Malaquias 3:1 e Isaías 40:3, atribuída a Isaías (costume antigo de citar o profeta mais proeminente — o tema do "novo êxodo" de Is 40). Copistas bizantinos, sem entender isso, mudaram para "nos profetas".']},
 {k:'prioridade', t:'Explicações da prioridade', p:[
  '1) <strong>Agostinho</strong>: Mateus → Marcos → Lucas. Nenhum ou poucos apoiadores.',
  '2) <strong>Griesbach e Farmer</strong>: Mateus primeiro, Lucas usou Mateus, e Marcos foi o último, um resumo dos dois. Minoria.',
  '3) <strong>Holtzmann e Streeter — hipótese das duas fontes (2SH)</strong>: Marcos primeiro; Mateus e Lucas usaram, de forma independente, Marcos e uma fonte perdida de ditos chamada Q (de <em>Quelle</em>, "fonte" em alemão). A mais aceita.',
  '4) <strong>Farrer-Goulder</strong>: Marcos primeiro, Mateus usou Marcos, e Lucas usou Marcos e Mateus — dispensando Q. Base: artigo de Austin Farrer (1955), "On Dispensing with Q". Minoria, mas em crescimento.']},
 {k:'marcos_primeiro', t:'Justificativas da prioridade de Marcos', p:[
  'a) Marcos é o mais curto: Mateus e Lucas o usaram acrescentando material. Se Marcos tivesse usado Mateus, por que omitiria o nascimento, o Sermão do Monte, o Pai Nosso e as aparições da ressurreição?',
  'b) As frases de Marcos foram melhoradas por Mateus e Lucas (gramática, construção, hebraísmos).']},
 {k:'evidencias', t:'Evidências da interdependência literária', p:[
  'a) <strong>Acordos verbais</strong>: 97,2% de Marcos tem paralelos em Mateus e 88,4% em Lucas; no grego há centenas de palavras coincidentes. b) <strong>Conteúdo</strong>: mesmas estruturas de frases e até formas gramaticais. c) <strong>Mesma ordem das perícopes</strong> (de João Batista à crucificação). d) <strong>Cláusulas parentéticas</strong> comuns, como "quem lê, entenda". e) <strong>Tradição tripla</strong> (comum aos três) e <strong>tradição dupla</strong> (Mateus e Lucas, ausente em Marcos, ex.: trechos do Sermão do Monte).',
  'Conclusão: é mais razoável aceitar que Marcos foi escrito primeiro e Mateus e Lucas o usaram do que o contrário.']},
 {k:'mt_lc_independentes', t:'Mateus e Lucas não se conheciam', p:[
  'Não houve dependência literária entre Mateus e Lucas. Se se conhecessem, Mateus teria usado o relato mais completo de Lucas sobre o nascimento, e Lucas o Sermão do Monte de Mateus.']},
 {k:'q', t:'A fonte Q', p:[
  'Além de Marcos, Mateus e Lucas tinham outra fonte comum: uma coleção de ditos de Jesus chamada Q (<em>Quelle</em>). Os versículos comuns a Mateus e Lucas que não estão em Marcos exigem uma fonte comum escrita em grego.',
  'Q não existe hoje e não é citada na antiguidade, mas deve ter existido; senão não há explicação para esses versículos. Q consiste em uma narrativa mínima e ditos de Jesus. Assim, as duas fontes de Mateus e Lucas são <strong>Marcos e Q</strong>. Por ser hipótese, está aberta a uma explicação melhor.']},
 {k:'contra_griesbach', t:'Contra a hipótese de Griesbach', p:[
  '1) Marcos parafraseia, não resume: seus relatos comuns costumam ser mais longos. 2) O grego de Marcos é o mais pobre: por que pioraria as frases de Lucas? 3) Passagens problemáticas de Marcos foram resolvidas em Mateus e Lucas: em Mc 6:5 Jesus "não pôde fazer" milagres; Mt 13:58 muda para "não fez", e Lucas omite. 4) Se Mateus fosse o primeiro, Marcos teria introduzido de propósito um problema cristológico — improvável.']},
 {k:'contra_farrer', t:'Contra a hipótese de Farrer-Goulder', p:[
  '1) O "massacre" do Sermão do Monte: Lucas teria desmontado o sermão bem ordenado de Mateus 5–7 e espalhado seus pedaços. 2) Os acordos menores: se Lucas tinha Mateus aberto, por que ora segue Mateus, ora Marcos, de modo aparentemente aleatório? 3) A redução teológica: Lucas teria feito cortes e reescritas drásticas em um texto tido como apostólico.',
  'Em suma: a hipótese elimina a Q "invisível", mas a substitui por um problema maior — um comportamento editorial de Lucas complexo e difícil de justificar.']},
 {k:'quatro', t:'A hipótese de quatro documentos', p:[
  'Formulada por B. H. Streeter em 1924, amplia a hipótese das duas fontes: há material exclusivo de Mateus (fonte <strong>M</strong>) e exclusivo de Lucas (fonte <strong>L</strong>). Fórmula: <strong>Marcos + Q + M + L = Mateus e Lucas</strong>.']}
]},
{id:6, tag:'Aula', n:'6', titulo:'Narrativas bíblicas', secoes:[
 {k:'autor_soberano', t:'O autor é o soberano do mundo narrativo', p:[
  'O autor não registra tudo o que aconteceu; ele faz escolhas: qual período apresentar, quais acontecimentos e personagens, o que dizer e o que omitir, em que ordem, como descrever, onde começar e como terminar. O mundo narrativo é construído a partir dessas escolhas.']},
 {k:'convite', t:'O autor convida o leitor', p:[
  'O autor quer que o leitor entre no mundo da narrativa e siga o caminho que ele construiu. O leitor então sente (emoção), pensa (reflexão), se identifica com os personagens (empatia), julga (avaliação), avalia valores e, às vezes, decide como agir.',
  'Antes de escrever, o autor já tem em mente o efeito que deseja produzir e seleciona e organiza os elementos para conduzir o leitor a essa reação.']},
 {k:'elementos', t:'Elementos da narrativa', p:[
  '<strong>Enredo</strong> (o que acontece; tensão, clímax, resolução); <strong>personagens</strong> (protagonistas, antagonistas, secundários); <strong>tempo</strong> (inclui flashback/analepse); <strong>espaço/cenário</strong>; <strong>narrador</strong> (quem conta); <strong>ponto de vista</strong> (de que perspectiva); <strong>conflito</strong> (a força que impulsiona a narrativa); <strong>tema</strong> (a ideia central).']},
 {k:'narrador', t:'O narrador nos Sinóticos', p:[
  'Nos Sinóticos o narrador é, em geral, de <strong>terceira pessoa</strong>, que narra de fora do mundo narrativo (extradiegético). Ex.: Mc 1:9 — "Naqueles dias, Jesus veio de Nazaré...". O narrador não é personagem.',
  'O narrador sabe mais que os personagens: em Mc 1:1 ("Princípio do evangelho de Jesus Cristo, o Filho de Deus") e 1:11, o leitor já sabe quem Jesus é. É útil distinguir o <strong>autor</strong> (quem escreveu) do <strong>narrador</strong> (a voz que conta); o autor transmite a história por meio do narrador.']},
 {k:'antigas', t:'Narrativas do mundo antigo', p:[
  'As narrativas judaicas e gregas do séc. I também selecionavam e organizavam eventos para influenciar o leitor. Josefo, por exemplo: seleciona acontecimentos, os ordena, coloca personagens fazendo longos discursos, descreve uns positiva e outros negativamente, e mostra como entender as causas.',
  'Os historiadores antigos não registravam os discursos palavra por palavra: mostravam o que a pessoa <strong>provavelmente teria dito</strong> naquela situação e suas motivações (tradição da historiografia grega). A estrutura é: evento → interpretação → avaliação → reação do leitor.',
  'Marcos também não quer só informar que Jesus morreu na cruz: o leitor que aceita o convite percebe que Jesus é o Messias que sofre e que o verdadeiro discípulo segue seu caminho, e se pergunta: "Eu compreendia Jesus corretamente?". A diferença é que os antigos não usavam a teoria moderna da narratologia.']},
 {k:'biblicas', t:'A perspectiva exegética', p:[
  'Grande parte da Bíblia é narrativa (Gênesis, Êxodo, Juízes, Samuel, Reis, Evangelhos, Atos). Ao lê-las, a pergunta fundamental é: <strong>"O que Deus quis comunicar aos leitores originais por meio desta história?"</strong> — a perspectiva exegética. A natureza do texto determina a abordagem: o autor construiu a narrativa para comunicar uma mensagem.']},
 {k:'inadequadas', t:'Perspectivas inadequadas', p:[
  '1) <strong>Precisão histórica</strong>: perguntar apenas "qual foi exatamente o fato?". Ex.: a ordem na morte de Jesus — Mc 15:37–38: grito → morte → véu rasgado; em Lucas (23:45–46) o véu se rasga antes da morte. Os evangelistas não estão dando uma cronologia detalhada.',
  '2) <strong>Pressupor a historicidade literal de tudo</strong>. Ex.: as <em>ipsissima verba</em> ("as próprias palavras") de Jesus na Ceia não são idênticas em Mt 26:26–29, Mc 14:22–25, Lc 22:14–20 e 1Co 11:23b–26. E o aviso sobre o traidor: em Mateus e Marcos vem durante a refeição; em Lucas, depois de repartir o pão e o cálice, no final da Ceia.',
  '3) <strong>Ver as narrativas apenas como material de pesquisa</strong> (histórica, social, arqueológica...). É possível e necessário, mas não deve ser a primeira nem a principal abordagem: antes, pergunte "o que esta narrativa pretende comunicar?".']},
 {k:'abordagens', t:'Abordagens necessárias', p:[
  '1) <strong>Exegética</strong>: o que o autor (e Deus) quis comunicar aos leitores originais? 2) <strong>Narratológica</strong>: o que a narrativa, como texto unificado e contínuo, comunica? (ex.: o motivo do segredo em Marcos só é entendido lendo Marcos como um todo). 3) <strong>Redacional</strong>: o que cada perícope comunica na forma como o autor a escreveu?']},
 {k:'camadas', t:'As camadas de comunicação', p:[
  'Narrativa secular: autor (personagens) → leitores originais. Narrativa bíblica: [autor (personagens) → leitores originais] → cristãos de todas as gerações.',
  'Camadas: 1ª entre os personagens; 2ª entre o autor e os leitores originais; 3ª entre Deus e seu povo nas gerações posteriores. A <strong>inspiração</strong> possibilitou a 2ª camada; a <strong>canonização</strong> possibilitou a 3ª.',
  'Livro recomendado: <em>Entendes o que lês?</em>, de Gordon D. Fee e Douglas Stuart (Vida Nova, 4ª ed.).']}
]},
{id:7, tag:'Aula', n:'7', titulo:'Introdução ao Evangelho de Marcos', secoes:[
 {k:'comunidade', t:'A comunidade marcana', p:[
  'Antes de entrar no texto é preciso compreender o contexto histórico: cada livro foi escrito numa situação concreta, para certos leitores e com um propósito.',
  'A "comunidade marcana" são os leitores que Marcos tinha em mente (também: leitores originais, comunidade por trás do Evangelho, audiência original, destinatários).']},
 {k:'perseguicao', t:'1. Uma comunidade perseguida', p:[
  'Evidência por <strong>leitura de espelho</strong> (mirror-reading): Marcos escolheu 8:34–38 (leitores talvez pressionados a negar Jesus), 13:9 (perseguição pela fé), 10:28–30 (a perseguição aparece na lista de bênçãos!), 13:13 ("sereis odiados por todos por causa do meu nome") e 4:17.',
  'O tipo de sofrimento depende do local: numa cidade helenizada fora de Roma, "alienação e acusação" dos vizinhos (não participar dos cultos era visto como deslealdade ao império); em Roma, também a <strong>perseguição de Nero</strong>. Hengel: a mulher "grega, siro-fenícia" (7:26) reflete uso ocidental, e a moeda <em>kodrantes</em> (12:42) não era usada no Oriente.']},
 {k:'mal_entendido', t:'2. Um mal-entendido cristológico', p:[
  'A comunidade pensava: "Jesus é o Messias; por isso vai nos dar salvação e vitória". Tinha ouvido que o fim glorioso já começara (escatologia presente) e que logo a glória seria plena. Os estudiosos chamam isso de <strong>"teologia da glória"</strong>.',
  'Mas a realidade era oposta: sofrimento e perseguição. Surgiram dúvidas — "Será que ele é o Messias mesmo? Se fosse, por que a perseguição?" — e a comunidade mergulhou em confusão cristológica e escatológica.']},
 {k:'parusia', t:'3. A parusia iminente', p:[
  'A comunidade cria que Jesus voltaria em breve. Isso fortalecia a teologia da glória: o momento da vitória parecia próximo. Havia forte expectativa de escatologia realizada.']},
 {k:'local', t:'4. Onde estava a comunidade?', p:[
  '<strong>Roma</strong> (hipótese tradicional): termos de origem latina; Marcos explica costumes judaicos (7:3–4); traduz expressões aramaicas — Boanerges, "filhos do trovão" (3:17), <em>Talitha koum</em> (5:41), <em>Ephphatha</em>, "Abre-te" (7:34), <em>Eloi, Eloi, lema sabachthani</em> (15:34); forte ênfase no sofrimento, talvez ligado a Nero. Roma era multilíngue (latim e koiné).',
  '<strong>Síria</strong>, especialmente Antioquia: os leitores incluíam judeus e gentios, e Antioquia era um centro de comunidade mista, com evidência direta no NT (Atos 11) e ligação com Paulo e Barnabé. Alexandria também é possível, mas há poucas evidências do cristianismo alexandrino no séc. I.',
  'Conclusão: o local é incerto; Roma e Síria são as principais hipóteses, sem consenso.']},
 {k:'membros', t:'5. Quem eram os membros', p:[
  'Não eram judeus tradicionais criados na Palestina: em 14:36 Marcos traduz "Abba" por "Pai", o que seria desnecessário para eles.',
  'Mas conheciam o judaísmo: Marcos cita o AT, faz alusões que exigem conhecê-lo e usa linguagem apocalíptica judaica (Mc 13; Dn 7); fala do reino de Deus e do Messias; a tese de 1:1–15 (Jesus é o Messias) se baseia em Ml 3:1 e Is 40:3.',
  'Conclusão: uma comunidade cristã fora da Palestina, formada majoritariamente por <strong>cristãos judeus da diáspora</strong> com alguma familiaridade com o judaísmo.']},
 {k:'resumo_comunidade', t:'6. Resumo: perseguição e apostasia', p:[
  'Os leitores enfrentavam uma realidade que parecia contrária à sua cristologia e escatologia e, longe de Jerusalém, corriam o risco de abandonar a fé (alguns talvez já tivessem voltado ao judaísmo ou à religião helenística). Duas palavras caracterizam a comunidade: <strong>perseguição e apostasia</strong>.',
  'Teologia da glória → perseguição → crise teológica → apostasia.']},
 {k:'proposito', t:'O propósito do autor', p:[
  '1:1 é uma declaração indireta do propósito: pregar o evangelho de que Deus agiu para efetuar seu governo soberano por meio de Jesus.',
  'Os leitores já conheciam o evangelho. Por que repeti-lo? Para: a) levá-los de novo à convicção de que Jesus é o Messias; b) esfriar o entusiasmo escatológico pela parusia imediata; c) enfatizar que o caminho dos seguidores de Jesus é o <strong>caminho da cruz</strong>. Marcos reescreveu a história que eles já tinham ouvido para corrigir erros e fortalecer a fé na perseguição.']},
 {k:'autoria', t:'Autoria: a posição tradicional', p:[
  'Tradição: João Marcos. Papias: "Marcos, tendo-se tornado <strong>intérprete de Pedro</strong>, escreveu com exatidão, embora não em ordem, tudo o que se lembrava das coisas ditas ou feitas por Cristo" (citado por Eusébio, <em>História Eclesiástica</em> 3.39.15).',
  '1Pe 5:13; At 12:12; Fm 24; Cl 4:10; 2Tm 4:11 mostram que Marcos existiu na igreja primitiva e estava ligado a Pedro e a Paulo.']},
 {k:'contra_autoria', t:'Autoria: argumentos contrários', p:[
  'O Evangelho não identifica seu autor; a identificação vem de tradição posterior. A relação João Marcos–Pedro não é clara: Atos mostra João Marcos com Paulo e Barnabé (12:12, 12:25, 13:5, 13:13 — voltou de Perge —, 15:37–39), e 1Pe 5:13 fala de "Marcos, meu filho", mas o NT nunca diz que são a mesma pessoa. Papias também não diz que Marcos era João Marcos.',
  'João Marcos era judeu de Jerusalém, mas: o autor escreveu em grego; usa latinismos — <em>modius</em> (4:21), <em>speculator</em> (6:27), <em>sextarius</em> (7:4), <em>census</em> (12:14), <em>flagellare</em> (15:15); e explica costumes judaicos (7:3–4; "Corbã" em 7:11). Alguns propõem que o autor viveu fora da Palestina.',
  'Resumo: o argumento não é "João Marcos não é o autor", mas <strong>"não há evidências suficientes para provar que o autor foi João Marcos"</strong>.']},
 {k:'obs_autoria', t:'Observações sobre a autoria', p:[
  'O autor não revelou sua identidade; o título "Evangelho de Marcos" foi acrescentado pelas igrejas décadas depois. A autoria afeta a interpretação menos do que o propósito do autor e as necessidades dos leitores.',
  'Três coisas a evitar: 1) afirmações exageradas sem evidências; 2) ignorar as evidências opostas; 3) atenção excessiva à questão.']},
 {k:'data_final', t:'Data, local e final do Evangelho', p:[
  '<strong>Data</strong>: meados dos anos 60 d.C. <strong>Local</strong>: desconhecido; Roma é tradicionalmente o mais provável, mas as evidências não são conclusivas (Síria/Antioquia também é proposta).',
  '<strong>Final</strong>: não temos o original, e os manuscritos diferem. Há quatro versões: 1) até o v. 8; 2) v. 8 + um final curto (muitas palavras não marcanas, estilo diferente); 3) até o v. 20 (tradicional); 4) até o v. 14 + um acréscimo sobre o domínio de Satanás (pouca evidência externa, expressões não marcanas).',
  'A versão 1 (até o v. 8) é considerada original; a 3 é a tradicionalmente usada, por isso os vv. 9–20 aparecem entre colchetes [ ].']},
 {k:'sanduiche', t:'O sanduíche de Marcos', p:[
  'Técnica em que uma história é interrompida por outra e depois retomada (<strong>A–B–A</strong>), para relacionar as duas, destacar temas, aumentar a tensão e fazer uma interpretar a outra.',
  '<strong>Figueira seca</strong> (11:12–14) / purificação do templo (11:15–19) / figueira seca (11:20–25): assim como a figueira chegou ao fim, o templo corrupto também chegará. <strong>Filha de Jairo</strong> (5:21–24) / mulher com hemorragia (5:25–34) / Jairo (5:35–43): ênfase na fé em Jesus, o Messias, agente do governo de Deus.',
  '<strong>3:20–35</strong>: família de Jesus / acusação de Belzebu / família — a verdadeira família são os que fazem a vontade de Deus. <strong>6:7–32</strong>: envio dos Doze / morte de João Batista / retorno — o ministério pode envolver sofrimento e morte, e prepara para o sofrimento de Jesus. <strong>14:1–11</strong>: conspiração / mulher de Betânia / Judas — contraste entre os que querem matar Jesus e a mulher que o honra, preparando seu sepultamento (14:8).']},
 {k:'tema', t:'O tema do Evangelho de Marcos', p:[
  'O tema central é <strong>a identidade de Jesus e suas implicações para o discipulado</strong>. Até 8:26 Jesus esconde sua identidade; em <strong>8:27</strong> ele mesmo inicia um diálogo sobre ela, que termina revelando-o como o servo sofredor. 8:27 é o ponto de virada; a identidade é repetida em 10:45 e 15:39.']}
]},
{id:8, tag:'Aula', n:'8', titulo:'O motivo do segredo messiânico', secoes:[
 {k:'redacao', t:'A crítica da redação de Marcos', p:[
  'Não conhecemos as fontes de Marcos. Como fazer crítica da redação? 1) Identificar as frases que o próprio Marcos escreveu: os <strong>resumos</strong> — 1:14–15 (todo o ministério de Jesus), 3:7–12 (ministério na Galileia), 6:53–56 (em Genesaré); as <strong>linhas de junção</strong> (seams), como 4:1–2, que preparam a coleção de parábolas; e <strong>1:1</strong>, a introdução, onde Marcos afirma que Jesus é o "Filho de Deus", título messiânico.',
  '2) A <strong>seleção</strong> dos materiais: Marcos os escolheu porque serviam ao seu propósito. 3) A <strong>ordem</strong> dos materiais: pelo arranjo, ele diz aos leitores o que quer dizer.']},
 {k:'ordem_8_10', t:'Exemplo: a ordem em 8:31–10:45', p:[
  'Marcos repete três vezes a sequência: <strong>predição da paixão → erro dos discípulos → ensino sobre discipulado</strong> (9 tradições em 3 repetições).',
  '1º ciclo: 8:31–32a / 8:32b–33 (Pedro repreende Jesus) / 8:34–9:1. 2º ciclo: 9:30–32 / 9:33–34 (discutem quem é o maior) / 9:35–10:31. 3º ciclo: 10:32–34 / 10:35–41 (Tiago e João) / 10:42–45.']},
 {k:'motivo_ordem', t:'O motivo dessa ordem', p:[
  'Dizer aos leitores: "Conheçam Jesus como o Servo sofredor e sejam seus legítimos seguidores, não só esperando bênçãos". O discípulo deve estar disposto a perder a vida por Cristo (8:34–35), ser servo de todos (9:35), participar não só da glória mas também do sofrimento (10:17–31) e beber o cálice de Jesus (10:38–39; cf. 14:36).']},
 {k:'definicao', t:'O que é o motivo do segredo messiânico', p:[
  'Um <strong>motivo</strong> é um elemento recorrente numa narrativa, fundamental para entendê-la. Em Marcos, Jesus reprime conversas sobre sua identidade e manda ficar quieto: é o "motivo do segredo messiânico". Na primeira metade, o Jesus de Marcos esconde sua identidade.']},
 {k:'ordens', t:'"Fique quieto!": a quem e quando', p:[
  'Jesus ordena silêncio: aos <strong>demônios</strong> (1:24–25; 1:34; 3:11–12); aos <strong>curados</strong> (1:44; 5:43; 7:36; 8:26); aos <strong>discípulos</strong> (8:30; 9:9 — Pedro, Tiago e João após a transfiguração).',
  'Situações: 3:11–12 curou muitos; 1:24–25 ensinou com autoridade; 1:34 curou muitas doenças; 1:44 curou um leproso; 5:43 ressuscitou uma menina; 7:36 curou um surdo e mudo; 8:26 curou um cego; 8:30 Pedro diz "Tu és o Cristo"; 9:9 após a transfiguração.']},
 {k:'locais', t:'Onde estão as ordens de silêncio', p:[
  'Todas estão na primeira metade (1:1–8:26), exceto duas: 8:30 e 9:9. Em 8:30 o motivo vem logo a seguir: no v. 31 Jesus, sem negar que é o Messias, acrescenta outro aspecto de sua identidade — o <strong>Filho do Homem sofredor</strong>.',
  'Depois dessa primeira apresentação (8:31), a ordem de silêncio não se repete, exceto em 9:9. Na segunda metade, ao contrário, o próprio Jesus inicia a conversa sobre sua identidade (8:27: "Quem as pessoas dizem que eu sou?").',
  'Pergunta da aula: por que "exceto em 9:9"? Repare que 9:9 limita o silêncio "até que o Filho do Homem ressuscite dentre os mortos".']},
 {k:'sinoticos', t:'As ordens de silêncio nos Sinóticos', p:[
  '<strong>Marcos: 9</strong> (1:25; 1:34; 1:44; 3:12; 5:43; 7:36; 8:26; 8:30; 9:9). <strong>Mateus: 4 + 1 = 5</strong> (8:4; 12:16; 16:20; 17:9; e 9:30, exclusivo de Mateus, da fonte M). <strong>Lucas: 5</strong> (4:35; 4:41; 5:14; 8:56; 9:21).',
  'Mateus e Lucas, muito mais longos, têm metade das ordens e omitem algumas de propósito (ex.: Mt 9:26 × Mc 5:43). Nenhum outro Evangelho repete o comando de forma tão constante quanto Marcos. No Evangelho de João, ao contrário, Jesus anuncia ativamente sua identidade: "Eu sou o pão da vida" (6:35), "a luz do mundo" (8:12), "a porta" (10:7), "o bom pastor" (10:11), "a ressurreição e a vida" (11:25), "o caminho" (14:6), "a videira verdadeira" (15:1).',
  'Conclusão: o comando frequente de silêncio é peculiar de Marcos e intencional desde a concepção do Evangelho.']},
 {k:'wrede', t:'A explicação histórica (e por que é insatisfatória)', p:[
  'O alemão <strong>W. Wrede</strong> foi o primeiro a identificar esse recurso literário. A primeira explicação é a <strong>histórica</strong>: Jesus realmente mandou ficar quieto, com medo de ser tomado como messias político-militar e levar a uma revolta anti-romana.',
  'É possível, mas insatisfatória: 1) na entrada em Jerusalém (11:1–10) o povo o recebe como Messias com o título "Aquele que vem em nome do Senhor" (11:9; Sl 118:26, lido de forma messiânica), e Jesus não manda silêncio; 2) em 5:42–43, a notícia de uma ressurreição se espalharia de qualquer jeito; 3) em 1:40–45, a ordem ao leproso já é quebrada no v. 45.']},
 {k:'cristologica', t:'A explicação cristológica e pastoral', p:[
  'Mais convincente: Marcos queria apresentar à comunidade o <strong>Messias sofredor e crucificado</strong>. Como? a) Insinuando que o entendimento de um messias só de glória e triunfo é inadequado — mostrando Jesus mandando silêncio justamente quando é reconhecido como messias glorioso. b) Destacando a identidade oposta na segunda metade: o Messias sofredor (8:31; 9:9, 31; 10:33–34, 45; 14:...).',
  'O clímax é <strong>10:45</strong>, a proclamação cristológica mais destacada de Marcos, confirmada em <strong>15:39</strong>, quando o centurião diz: "Verdadeiramente este homem era o Filho de Deus". 10:45 com 15:39 são: o clímax da cristologia de Marcos; a razão do motivo do segredo; o grito de Marcos à sua comunidade; e a voz de Deus a todos os cristãos que conhecem Jesus só como Messias de glória, triunfo, riqueza e sucesso.']},
 {k:'estrutura', t:'A estrutura de Marcos', p:[
  '<strong>Primeira parte (1:1–8:26)</strong>: Jesus silenciador — manda calar, mas não nega o aspecto de Messias glorioso. <strong>Seção central (8:27–10:45)</strong>: Jesus inicia o diálogo "Quem dizem que eu sou?" (8:27, 29), que conclui com o Filho do Homem sofredor (8:31). Ele não interrompe o diálogo em 8:30 nem nega a confissão de Pedro (8:29); acrescenta o aspecto que queria mostrar. A partir daí dominam as tradições com o título "Filho do Homem", que apresentam o Servo sofredor.',
  '<strong>Parte final</strong>: Jesus sofre de acordo com a identidade revelada na parte central. A estrutura sugere que a tese central de Marcos é: <strong>Jesus é o Servo sofredor</strong>.']},
 {k:'conclusao', t:'Conclusão', p:[
  'Marcos usa o motivo do segredo para reafirmar que Jesus é o Servo sofredor, que obedece à vontade de Deus até a morte. Ele não nega que Jesus seja o Messias glorioso, mas enfatiza o Servo sofredor — ênfase necessária para uma comunidade em sofrimento e perseguição.']}
]},
{id:101, tag:'Reino', n:'1', titulo:'O que é o reino de Deus?', secoes:[
 {k:'centralidade', t:'A centralidade do reino', p:[
  'O reino de Deus era o centro do ministério de Jesus: Mc 1:15 (resumo de sua proclamação); Mt 10:5–15 (envia os discípulos a fazer o mesmo, v. 7); assunto frequente de seus ensinos (Mt 13); o Pai Nosso; o Sermão do Monte (Mt 5:3–7:27); "o evangelho do reino" (Mt 24:14); e o centro do ministério pós-ressurreição (At 1:3b).']},
 {k:'historia', t:'Interpretações: da igreja aos liberais', p:[
  '<strong>De Agostinho aos reformadores</strong>: o reino de Deus = a igreja.',
  '<strong>Teólogos liberais</strong> (Harnack, Ritschl, Herrmann, fim do séc. XIX e início do XX): o reino = "a religião pura ensinada por Jesus" — paternidade de Deus, irmandade do homem, valor infinito da alma e ética do amor; algo que atua nos corações.',
  'Crítica: é um conceito descontextualizado; não consideraram a LAJI (literatura apocalíptica judaica intertestamentária) nem a situação histórica de Israel. Jesus nunca ensinou o reino como atuação no coração; para ele o reino era sempre <strong>ação exterior libertadora de Deus</strong> no mundo real (doenças, condenação, espíritos malignos, morte). E são ações escatológicas e contínuas, diferentes das intervenções ocasionais do AT (Mar Vermelho, Jericó, 1Rs 18:38). Os liberais apenas especularam.']},
 {k:'laji', t:'A necessidade de estudar a LAJI', p:[
  'O AT não tem a frase "reino de Deus", mas João Batista e Jesus a usaram sem explicá-la, e o público entendeu. Logo, a frase era corrente: foi criada no período intertestamentário, e é na LAJI que devemos estudá-la.',
  'Na LAJI a frase significava <strong>"as ações de Deus que salvam ou libertam seu povo, na última era, das mãos do seu inimigo"</strong> — exatamente o sentido na boca de Jesus.',
  'Com os judeus dominados por impérios sucessivos (Assírio, Babilônico, Persa, Grego, Romano) e cerca de 420 anos sem melhora entre Malaquias e João Batista, os escritores voltaram os olhos para a realidade celestial, onde Deus reina sem oposição, e para as promessas do Messias. Esse gênero é a literatura apocalíptica judaica, chamada de <strong>"literatura de crise"</strong>, por encorajar a fé em tempos difíceis. Sua origem é a literatura profética do AT (Isaías, Ezequiel, Daniel), com forma plena no período intertestamentário.']},
 {k:'weiss', t:'Johannes Weiss', p:[
  'Aluno e genro de Albrecht Ritschl, estudou a frase à luz do apocaliptismo judaico. Conclusão: o reino é essencialmente um <strong>conceito apocalíptico</strong> — o rompimento de uma intervenção divina que destrói a ordem atual e estabelece uma nova; só acontece quando Deus quer, e o homem não pode influenciar sua vinda. Abriu uma nova página na pesquisa do reino.']},
 {k:'sentido', t:'O sentido principal e o secundário', p:[
  '<strong>Principal</strong>: os atos de Deus nos últimos dias que salvam seu povo dos seus inimigos. No AT os inimigos eram os impérios gentios; nos dias de Jesus, os <strong>espíritos malignos</strong> (a literatura apocalíptica mudou o foco do mundo terrestre para o espiritual).',
  'O sujeito é sempre <strong>Deus</strong>: o povo pode pedir, mas nunca controlá-lo; ele intervém quando quer. É o ato dinâmico de Deus como rei na realidade do seu povo, não nos corações (a obra no coração é a obra do Espírito Santo).',
  '<strong>Secundário</strong>: a área onde o ato de Deus atinge. Aplique primeiro o sentido principal; só quando não fizer sentido, use o secundário. BDAG: <em>basileia</em> = 1) o ato de domínio de um rei; 2) o território dominado. "<em>tou theou</em>" é genitivo subjetivo: Deus é o sujeito da ação. Exercício: Mc 1:15; Mc 4:11; Lc 8:10; Lc 9:11; Lc 13:28; Lc 16:16.']},
 {k:'tensive', t:'Um símbolo "tensive"', p:[
  'Norman Perrin: "o reino de Deus" é um símbolo <strong>tensive</strong>, não steno. Assim como "fruta" (tensive) abrange maçã, melão, coco (steno), o reino na boca de Jesus se refere a vários atos de Deus: expulsar demônios, curar, proclamar julgamento e justificação.']},
 {k:'ceus', t:'O reino dos céus', p:[
  'Mateus usa "reino dos céus" com o mesmo sentido de "reino de Deus". Ex.: em Mt 11:12 ele troca o termo de Q preservado em Lc 16:16; em Mt 5:3 troca o "reino de Deus" de Lc 6:20; em Mt 4:17 troca o de Mc 1:15. Caragounis: não há base exegética para distinguir os dois termos (contra M. Pamment).',
  'Por quê? Mateus escrevia para uma comunidade mais judaica, que seguia a forma tradicional de se referir a Deus ("céus"), evitando mencionar "Deus" com bocas ritualmente impuras. Todos os livros do NT são textos ocasionais.']},
 {k:'originais', t:'Pontos originais do ensino de Jesus', p:[
  '1) <strong>"Aqui e agora!"</strong> — o reino não é só esperança, já chegou e está disponível. 2) <strong>"Para todo o mundo, não somente para os judeus!"</strong> (Mt 8:12; 13:38; Mc 10:15). 3) <strong>Não é um reino político na terra</strong>, mas o domínio escatológico eterno de Deus, que começa com o ministério de Jesus. 4) <strong>É através de Jesus que o reino se manifesta</strong> — ele é o único agente do reino. 5) <strong>"Chegou agora, mas a consumação é no futuro!"</strong>']}
]},
{id:102, tag:'Reino', n:'2', titulo:'A necessidade do reino de Deus', secoes:[
 {k:'duas_eras', t:'As duas eras', p:[
  'Jesus dividia a história em duas partes (Mt 12:32): <strong>"esta era"</strong> e <strong>"a era por vir"</strong>. Essa divisão vem da LAJI, e as duas eras são opostas.',
  '<strong>Esta era</strong>: fraqueza, mortalidade, mal, pecado e morte; seu rei é <strong>Satanás</strong>. O povo pedia: "Deus, Rei dos reis, venha à nossa situação e aja como Rei em nosso favor!".',
  '<strong>A era por vir</strong>: realização das promessas do reino — relacionamento restaurado com Deus, redenção, vida abundante, domínio de Israel sobre os impérios, peregrinação dos gentios a Jerusalém, glorificação do nome de Deus. Promessa × realização; esperar × experimentar.',
  'Os impérios passavam um ao outro o bastão da opressão, e o povo esperava com desejo ainda mais ardente. Aí está a necessidade do reino de Deus.']},
 {k:'linha', t:'A linha divisória: real mas parcial', p:[
  'O início do ministério público de Jesus é o fim de "esta era" e o começo da "era por vir": o reino entrou na realidade do povo pela pessoa e ministério de Jesus.',
  '<strong>"Real mas parcial"</strong>: sua atuação era real (curas, perdão, justificação, ensino, convite), mas parcial no alcance: nem todos os doentes foram curados, nem todos os que rejeitaram foram julgados. O reino espera a consumação na Parusia, quando o domínio de Deus será universal. Por isso: "actual but partial" ou <strong>"já, mas ainda não"</strong>.']},
 {k:'satanas', t:'Satanás e o dualismo escatológico', p:[
  'O judaísmo intertestamentário multiplicou o conceito de espíritos malignos, e os Evangelhos refletem isso (Mc 3:22: "príncipe dos demônios"). Funções de Satanás: a) opor-se ao plano redentor de Deus por Jesus (tentação no deserto, Mt 4:8–11; tentação por Pedro, Mt 16:21–23) — sempre falhou; b) desviar o povo de Deus da fé — às vezes conseguiu (apostasia).',
  'Satanás sofreu grande dano pelo reino e começou a soltar seus cativos. Na parábola de <strong>Oscar Cullmann</strong>, ele está amarrado por uma longa corda e continua tentando até a Parusia, quando será destruído.',
  'Paulo chama Satanás de "deus desta era" (2Co 4:4), mostrando que absorveu a visão das duas eras (cf. Mt 24:3; Mc 10:30; Lc 21:34–35; 1Co 1:20; 2:8; 3:18; Ef 1:21). Essa estrutura de tempo é o <strong>"dualismo escatológico"</strong>, usada em Rm 12:2 ("não vos conformeis com esta era"). Implicação: o intérprete do NT deve ter essa visão.']},
 {k:'demonios', t:'Demônios e exorcismo', p:[
  'Os demônios estão sob o controle de Satanás. No judaísmo esperava-se a destruição do poder satânico no fim desta era; nos Evangelhos, os demônios reconhecem que Jesus pode esmagá-lo "aqui e agora".',
  'O exorcismo era a forma mais vívida e direta da luta entre Jesus e o poder satânico — não uma atividade periférica, mas <strong>o centro de sua missão messiânica</strong>. Inimigo do povo de Deus: antes de Jesus, os impérios gentios; nos dias de Jesus, os espíritos malignos. A teologia do reino é de conflito e conquista (cf. a vitória do Cordeiro no Apocalipse).']},
 {k:'cristaos', t:'Cristãos: pessoas de duas eras', p:[
  'Muitos anunciavam que o reino viria, mas ninguém disse que havia chegado, como Jesus. Antes de Jesus o reino era esperança; depois, objeto de experiência — por isso não era mais "notícia de esperança", mas <strong>"evangelho"</strong> (Mt 4:23; 9:35; 24:14; Lc 4:43; 16:16).',
  '"Salvar" (Lc 19:10) significa tornar os cativos desta era beneficiários da era por vir. Os cristãos vivem real mas parcialmente essa realidade: são pessoas de duas eras.',
  'N. T. Wright: a pergunta de todo judeu em Jerusalém em meados do séc. I era "quando o Único Deus libertará seu povo do governo romano e estabelecerá seu reino?".']}
]},
{id:103, tag:'Reino', n:'3', titulo:'O Deus do reino', secoes:[
 {k:'intro', t:'O Deus que entrou na história', p:[
  'Jesus proclamou que Deus entrou na história e começou a agir em favor do seu povo, e ensinou quem é esse Deus. O reino é o resultado do ser de Deus: se ele fosse um rei mau, seus atos seriam devastadores; sendo bom, o resultado é o oposto.']},
 {k:'busca', t:'1. O Deus que busca', p:[
  'No AT Deus também buscava seu povo, mas de forma <strong>indireta e ocasional</strong>, por meio dos profetas ("Deus dos profetas").',
  'No período do Segundo Templo (515 a.C.–70 d.C.) Deus era visto como transcendente, distante, sentado no trono do céu, sem intervir. O povo desejava que ele viesse e realizasse o ato redentor final.',
  'Nos ensinos de Jesus, Deus entra na história por meio de Jesus e vem ele mesmo buscar seu povo: uma busca <strong>direta</strong> (não via profetas) e <strong>permanente</strong> (não ocasional). É o clímax da história da salvação.']},
 {k:'lucas15', t:'As parábolas de Lucas 15', p:[
  'O elemento comum da ovelha perdida, da moeda perdida e do filho pródigo é <strong>o Deus que busca</strong>: há sempre uma iniciativa divina (o pastor procura, a mulher varre, o pai anseia).',
  'A parábola do filho pródigo é sobre o <strong>pai</strong>, não sobre o filho: o pai é o protagonista e representa Deus. A mensagem central é o amor e a graça de Deus que busca o filho que não merece.']},
 {k:'convida', t:'2. O Deus que convida', p:[
  'As ações de Jesus são ações de Deus. A <strong>comunhão de mesa</strong> de Jesus era uma "parábola de ação": mostrava a comunhão íntima entre Deus e seu povo após a Segunda Vinda. Para os judeus, comer junto era um evento social entre pessoas queridas. Jesus convidou marginalizados, condenados e impuros em vez de condená-los.',
  'O convite foi possível porque o problema do pecado foi resolvido pela morte e ressurreição de Jesus: os que creem nele são declarados justificados.']},
 {k:'perdao', t:'Perdão e arrependimento', p:[
  'No judaísmo da época, o perdão vinha pelo arrependimento: o violador da lei admitia a violação e passava pelo processo de expiação, e o sacerdote declarava o perdão. O pecador tinha de tomar a iniciativa — como também afirmava João Batista.',
  'O arrependimento que Jesus exigia era diferente: não "abandone os pecados e volte a Deus", mas <strong>abandone o caminho de buscar sua própria justificação pelas obras da lei</strong> e aceite a justificação dada gratuitamente por Deus.']},
 {k:'pai', t:'3. Deus Pai (Abba)', p:[
  'Jesus apresenta Deus como Pai (Mt 6:9; 23:9), chama-o de <strong>Abba</strong> e ensina os discípulos a fazer o mesmo. Paulo herdou o título (Rm 8:15; Gl 4:6), transliterando-o e traduzindo-o para os gregos. Abba era como as crianças (e depois os adultos) chamavam o pai: designação carinhosa.',
  'De quem Deus é Pai? <strong>Somente dos que responderam ao seu amor e aceitaram o evangelho do reino</strong> — um privilégio restrito (cf. Jo 20:17, "vosso Pai").',
  'Mal-entendido: "a paternidade de Deus é universal" (Mt 5:44–46). Não: o trecho faz parte da ética do povo de Deus (Mt 5:3–7:27). O v. 45b mostra a bondade de Deus, não uma paternidade universal. Não amamos os inimigos para nos tornar filhos, mas porque somos filhos (Hagner: "os filhos do reino são chamados a refletir o caráter de seu Pai").']},
 {k:'juiz', t:'4. Deus, o Juiz final', p:[
  'Quem é convidado fica diante de uma bifurcação: aceitar ou rejeitar, e a escolha determina o destino eterno. O Deus que busca e convida é também o Deus que julga os que rejeitam o convite.']}
]},
{id:104, tag:'Reino', n:'4', titulo:'A vinda e presença do reino', secoes:[
 {k:'intro', t:'O reino chegou', p:[
  'Na LAJI o reino era algo futuro. Jesus, diferente de seus antecessores, proclamou que o reino <strong>finalmente chegou</strong> e já trabalha em favor do seu povo. Essa chegada é o evangelho que ele proclamou.']},
 {k:'laji', t:'A vinda do reino na LAJI', p:[
  '<strong>1 Enoque</strong> (hebraico, séc. III–I a.C.; apocalíptico, pseudepigráfico, apócrifo): nas "Visões dos sonhos", depois do julgamento Deus libertará Israel e punirá seu torturador. <strong>Sirácida / Eclesiástico</strong> (séc. II a.C., hebraico, por Ben Sira em Jerusalém): "O fogo consumirá nações hostis. Deus reunirá todas as tribos de Jacó".',
  '<strong>Sabedoria de Salomão</strong> (séc. I a.C.–I d.C., grego, provavelmente Alexandria): Deus devastará o reino dos sem-lei e inaugurará uma nova era. <strong>Testamento (Assunção) de Moisés</strong> (séc. II–I a.C.; profecias de Moisés a Josué): terremotos, escuridão do sol e da lua; então o reino virá de repente (cf. Mc 13:24–26). <strong>Salmos de Salomão</strong> (séc. II–I a.C.; 18 poemas): esperam a rápida intervenção de Deus, que estabelecerá o reino eterno pelo Filho de Davi, o Messias.',
  'Em todos o reino é algo por vir no futuro.']},
 {k:'diferenca', t:'A maior diferença', p:[
  'A maior diferença entre a LAJI e Jesus é <strong>o tempo da vinda</strong>: a proclamação de que o reino já chegou não tem paralelos na LAJI. Beasley-Murray: "O fato mais distintivo na proclamação de Jesus do reino foi o seu presente <strong>irrompimento</strong> na história em sua própria pessoa e ministério."']},
 {k:'textos', t:'Textos do reino presente', p:[
  '<strong>Mt 12:28</strong>: <em>ephthasen</em> é aoristo — "veio"; <em>epi</em> + genitivo = "sobre", indicando o reino que chega de cima em favor do povo. <strong>Mt 12:29</strong>: Jesus amarrou o inimigo e libertou o povo, graças à vinda presente do reino.',
  '<strong>Lc 17:20–21</strong>: <em>entos hymōn</em> — a melhor tradução é "<strong>no meio de vocês</strong>". <strong>Mc 1:15</strong>: <em>peplērōtai ho kairos</em> ("o tempo está cumprido", perfeito passivo) — o tempo de espera entre profecia e cumprimento acabou; <em>ēngiken</em> pode significar "está perto" ou "chegou", e a construção da frase indica "chegou" (Guelich).']},
 {k:'bencaos', t:'As bênçãos do reino presente', p:[
  '1) <strong>Cura física e mental</strong>: hemorragia (Mc 5:25–34), cegueira (Mc 10:52), possessão (Lc 8:36), morte (Mc 5:23), exorcismos. Mas é limitada; a cura universal virá na Parusia.',
  '2) <strong>Perdão de pecados agora</strong>: os profetas anunciavam um dia futuro de perdão; Jesus perdoa aqui e agora — a cura do paralítico é a prova (Mc 2:10).',
  '3) <strong>Justificação agora</strong>: para os rabinos, a justificação resultava da obediência à Lei e de atos de misericórdia (autoalcançada). Jesus anunciou que é uma dádiva gratuita de Deus. A ética do reino torna os requisitos ainda mais exigentes (Mt 5:21–42: não só não matar, mas não ter raiva; não só não adulterar, mas não desejar), de modo que ninguém consegue a justificação pela obediência.',
  '4) <strong>Relacionamento com Deus restaurado</strong>: justificação → fim da inimizade → volta ao relacionamento original. Deus é Pai (o pai que dá coisas boas, o pai do pródigo, a mulher e a moeda, o pastor e a ovelha) — bênção abrangente que inclui muitas outras.']},
 {k:'como', t:'Como ser beneficiado', p:[
  'Basta aceitar e crer na proclamação de Jesus de que Deus está entrando na história por meio dele. A expressão dessa aceitação é <strong>receber o agente do reino</strong> — Jesus ou seus discípulos (cf. Jo 1:12). Zaqueu se tornou povo do reino quando recebeu Jesus em casa (Lc 19:6), não quando fez boas obras (19:8).']},
 {k:'vida_eterna', t:'Vida eterna', p:[
  '"Herdar a vida eterna", "entrar no reino de Deus" e "ser salvo" eram sinônimos (Mc 10:17–27). <em>Zōē aiōnios</em>: o adjetivo pode significar "eterno" ou "da era"; aqui significa "da era" — a vida da <strong>nova era</strong>, iniciada com a vinda do reino.',
  'Portanto, vida eterna não é vida após a morte nem vida sem morte. Diante do convite há duas opções: aceitar ou não receber (Lc 10:8–9); quem aceita se torna povo de Deus e desfruta das bênçãos do reino presente.']}
]},
{id:105, tag:'Reino', n:'5', titulo:'O futuro reino de Deus', secoes:[
 {k:'intro', t:'Real mas parcial', p:[
  'Nem todos os doentes foram curados e nem todas as expectativas da LAJI se realizaram: o reino presente é real mas parcial. No ensino de Jesus o reino tem outra manifestação no futuro: na Parusia, Deus cumprirá todas as promessas, levando a salvação à forma completa (salvação consumada) e condenando de forma irreversível o inimigo.']},
 {k:'painosso', t:'1. O Pai Nosso', p:[
  'Em Lc 11:1 ("ensina-nos a orar"), o pedido não é sobre como orar, mas para ensinar, em forma resumida, a teologia e a visão do movimento de Jesus (o reino), como João Batista fazia com seus discípulos. Jerusalém era uma arena de movimentos socio-religiosos (fariseus, sacerdotes, zelotes, João Batista, Jesus). Por isso o Pai Nosso deve ser lido com os "óculos" da teologia do reino.',
  '<strong>"Venha o teu reino"</strong>: o reino chegou, mas sua atuação é parcial; pedimos que se manifeste logo em sua totalidade — evidência do <strong>reino futuro</strong>. <strong>"Seja feita a tua vontade assim na terra como no céu"</strong> (só em Mateus): pedido pelo avanço futuro da vontade de Deus; é revolucionário, pois rejeita o mal e busca a ordem divina.',
  'As duas petições pedem: o domínio universal de Deus; ordem e paz em toda a criação; e a conquista da <strong>morte</strong>, nosso inimigo final.']},
 {k:'sermao', t:'2. O Sermão do Monte', p:[
  'O sermão trata da nova era (seus benefícios e a nova ética) e deve ser lido com os mesmos óculos. Mostra o reino presente — "agora" (<em>nyn</em>) em Lc 6:21 — e o futuro — "grande é a vossa recompensa no céu" (Lc 6:23b).',
  'Mt 5:10 fala de ambos. Ladd: algumas bênçãos são presentes e futuras — os que choram podem ser consolados agora e, no futuro, Deus removerá todas as lágrimas.']},
 {k:'ditos', t:'3. Ditos sobre o reino futuro', p:[
  '<strong>A vinda futura</strong> (Mt 26:64; 25:31; Mc 9:1): na Parusia o mal será aniquilado e o povo desfrutará a salvação completa.',
  '<strong>A festa do reino</strong> (Mt 8:11–12; Lc 13:28–30): não tem paralelo no AT; nem Is 25:6 fala de povos vindos do leste, oeste, norte e sul, nem de Israel excluído. Jesus usou a ideia da "Festa do Messias" (Is 25:6–12) como símbolo do reino futuro: gentios e judeus, pobres e ricos, homens e mulheres formando uma comunidade de salvação — parcialmente agora e plenamente no futuro.',
  '<strong>O julgamento final</strong> (Mt 25:31–32): manifestação universal e visível do reino futuro.']},
 {k:'parabolas', t:'4. Parábolas do reino futuro', p:[
  '<strong>Os talentos</strong> (Mt 25:14–30): está nos caps. 24–25, sobre como o povo do reino deve viver; os vv. 19–30 falam do reino futuro. Foi contada aos que aceitaram o convite, para alertá-los do dia do ajuste de contas e ensiná-los a viver fiéis à nova identidade. O terceiro empregado é quem foi atraído pela proclamação de Jesus, mas recusa a ética do povo do reino.',
  '<strong>As ovelhas e os cabritos</strong> (Mt 25:31–46): o v. 34 mostra o reino futuro — "herdai o reino que vos está preparado desde a fundação do mundo".']}
]},
{id:106, tag:'Reino', n:'6', titulo:'O segredo do reino de Deus', secoes:[
 {k:'preconceitos', t:'Por que não perceberam o reino?', p:[
  'A maioria dos judeus, embora esperasse o reino, não o aceitou quando se manifestou, por causa de seus preconceitos: 1) esperavam um poder irresistível de Deus, mas Jesus era um galileu comum, aparentemente sem poder; 2) esperavam que as nações ímpias fossem destruídas (Dn 2:44), mas Roma continuava firme; 3) esperavam que Israel herdasse o reino e as nações o servissem (Dn 7:27), mas continuavam sob Roma; 4) esperavam convulsões cósmicas e milagres antes da vinda, e isso não aconteceu. Por isso a vinda do reino foi um <strong>segredo</strong> para muitos.']},
 {k:'parabola_def', t:'Como interpretar parábolas', p:[
  'Parábola é uma história curta (verdadeira, fictícia ou mista) para ensinar uma mensagem central. Não é alegoria: a parábola transmite uma mensagem; a alegoria, várias, em relação 1:1. Por isso buscamos a mensagem central. Quase todas as parábolas de Jesus são sobre o reino ou seus subtemas: devemos usar os "óculos" da teologia do reino.']},
 {k:'semeador', t:'O semeador (Mt 13:1–9)', p:[
  'Tem sua interpretação em Mt 13:18–23; "a palavra do reino" (13:19) é o evangelho do reino. Embora seja lida como alegoria (quatro solos = quatro tipos de coração), é uma parábola (13:18).',
  'Mensagem central: o reino não chegou como os judeus esperavam; a proclamação de Jesus parecia semente em lugar impróprio. O reino chegou, mas poucos perceberam — a <strong>presença oculta do reino</strong> ("os mistérios do reino dos céus", 13:11; cf. Jo 1:4–5; 1Co 1:18).']},
 {k:'joio', t:'O joio (Mt 13:24–30)', p:[
  'Os judeus criam que a vinda do reino encerraria esta era e julgaria os ímpios. A parábola foi dita a ouvintes perturbados porque o bem e o mal continuavam coexistindo: o reino chegou <strong>sem efetuar o juízo final</strong>.',
  'No futuro reino essa sociedade mista acabará, e os justos brilharão como o sol (13:40–43). Implicação: os aspectos insatisfatórios do reino presente só serão resolvidos no reino futuro.']},
 {k:'mostarda', t:'O grão de mostarda (Mt 13:31–32)', p:[
  'Dúvida dos discípulos: "Por que a vinda do reino é tão parcial e pequena?" Poucos experimentavam as bênçãos, Roma continuava dominando e Jesus parecia um sonhador. Resposta: agora a manifestação é parcial, como um grão de mostarda, quase invisível; no futuro será uma grande árvore, visível a todos. É uma parábola sobre a <strong>escala</strong> do reino presente.']},
 {k:'fermento', t:'O fermento (Lc 13:20–21)', p:[
  'Esperava-se que o reino derrubasse a ordem do mal, mas as potências estrangeiras continuavam dominando. Um pouco de fermento na massa parece não fazer nada, como se tivesse sido engolido, mas no fim transforma toda a massa: o reino futuro governará o mundo sem nenhuma soberania concorrente.',
  'Comparação: a mostarda fala da <strong>escala pequena do reino presente</strong>; o fermento, do <strong>poder do reino futuro</strong>.']},
 {k:'tesouro_perola', t:'O tesouro escondido e a pérola', p:[
  'Ambas dizem o mesmo: o reino tem valor inestimável e prioridade absoluta. Como o reino presente começou pequeno e parece engolido, Jesus diz: aceitem prontamente o convite, como quem acha um tesouro ou uma pérola e o agarra com força e rapidez.']},
 {k:'rede', t:'A rede (Mt 13:47–50)', p:[
  'Esperava-se que o Messias destruísse os ímpios e reunisse um povo santo, sem injustiça no meio dele (Salmos de Salomão 17:28, 36). Mas cobradores de impostos e prostitutas não eram julgados; comiam com Jesus e pareciam fazer parte do povo do reino. "Como dizer que o reino chegou?"',
  'Mensagem central: a separação entre justos e ímpios será feita no <strong>juízo final</strong>, na vinda do reino futuro. Até lá, justos e ímpios estarão juntos.',
  'Diferença: o <strong>joio</strong> mostra que o reino está presente num mundo onde pecadores e justos coexistem; a <strong>rede</strong> mostra que a igreja (os que aceitaram o convite) não é uma comunidade pura, e haverá uma separação final.']}
]},
{id:107, tag:'Reino', n:'7', titulo:'O reino de Deus e a Igreja', secoes:[
 {k:'def', t:'O que é a igreja', p:[
  'Jesus falava aramaico; as palavras aramaicas para "igreja" significam basicamente "comunidade". A LXX traduziu uma delas (qahal) por <strong>ekklēsia</strong>.',
  'A igreja é o grupo de pessoas que aceitaram Jesus como o <strong>único agente do reino de Deus</strong>, por meio de quem Deus se manifestou como Rei e começou a resgatar seu povo dos inimigos (Satanás e demônios).']},
 {k:'natureza', t:'A natureza da igreja', p:[
  '1) <strong>Comunidade escatológica</strong>: Jesus era a figura escatológica esperada; a igreja surgiu da fé nele e faz o ministério escatológico dele — a salvação do povo de Deus na última era — após sua ascensão.',
  '2) <strong>O verdadeiro Israel</strong>: diante do convite, o público se dividiu entre os que creram em Jesus como o Messias e os que não creram; os primeiros são o verdadeiro Israel. Jesus reconhecia o AT, as sinagogas e o templo, e via seu ministério como cumprimento das profecias (Is 58 e 61 na sinagoga; a resposta a João Batista).']},
 {k:'relacao1', t:'1. O reino cria a igreja', p:[
  'Pela atuação dos agentes (Jesus e os discípulos), o público era desafiado a aceitar ou rejeitar. Como argumentou Bultmann, Deus é o Demandante, e as pessoas ficavam em crise existencial: vida eterna ou condenação. Os que responderam positivamente formaram a igreja.']},
 {k:'relacao2', t:'2. A igreja testemunha o reino', p:[
  'A missão da igreja é testemunhar e anunciar as vindas (primeira e segunda) e a atuação do reino (Mt 10; Lc 10; Atos). Duas maneiras: 1) a <strong>proclamação</strong> do reino; 2) a <strong>vida do povo do reino</strong> — suas bênçãos e sua ética (perdão, humildade, gratidão, relação restaurada e comunhão com Deus).']},
 {k:'relacao3', t:'3. A igreja é instrumento do reino', p:[
  'Jesus enviou os discípulos para fazer o mesmo ministério: proclamar o evangelho do reino, curar e expulsar demônios (Lc 10:17; Mt 10:8), mesmo nem sempre com sucesso. Após a ascensão, a igreja recebeu o bastão.',
  'Cronologia dos agentes do reino: <strong>Jesus → 12 discípulos → Igreja</strong>. Hoje a igreja tem o bastão: subjuga Satanás, liberta os cativos e traz o povo de Deus à salvação.']},
 {k:'relacao4', t:'4. A igreja preserva a condição de entrada', p:[
  'O critério é confessar que Jesus é o Messias por meio de quem Deus salva seu povo. Em <strong>Mt 16:19</strong>: "te" = Pedro, que conhecia bem Jesus e podia representá-lo. As <strong>chaves</strong> simbolizam autoridade (cf. Ap 1:18): a autoridade de admitir alguém no reino ou negar sua entrada. <strong>Ligar e desligar</strong> era expressão da época para permitir ou proibir uma conduta com base na lei mosaica; aqui, declarar a entrada concedida ou negada conforme os ensinamentos de Jesus (cf. 18:18).',
  'Pedro só podia exercer essa autoridade enquanto se baseasse fielmente nos ensinos de Jesus. Hoje a igreja desempenha esse papel: declara a entrada no reino e batiza — a igreja tem as chaves.']}
]}
];
